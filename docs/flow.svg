<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 856" width="830" height="856" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How Graft's flow works</title>
  <desc id="flow-desc">/graft:research, /graft:plan and /graft:execute carry a start tab: they are where you begin. /graft:research on top, then three steps from left to right, and one row below them. /graft:research: you steer, researcher finds facts, experimenter runs experiments, and adversarial-reviewer challenges the findings; it writes .claude/graft/research/&lt;name&gt;/report.md, which /graft:plan takes as context. /graft:plan: you answer questions, researcher finds facts, and reviewer and adversarial-reviewer review; it writes .claude/graft/plans/&lt;name&gt;.md. /graft:orchestrate: for each milestone, worker implements and then the change is committed, with reviewer and adversarial-reviewer reviewing beside the loop; then comment-editor and docs-editor clean up; it produces commits on a branch. /graft:pr: push and open a PR; it produces a PR. Below plan and orchestrate, one block holds /graft:execute and /graft:yolo, which both run plan and then orchestrate in one session: in /graft:execute you decide, and in /graft:yolo the agent decides and produces a ready PR with screenshots. Beside that block, /graft:diff publishes a Claude Code artifact of the commits on a branch for you to review and comment on, then Claude acts on your feedback. A key at the bottom shows that the start tab marks where you begin.</desc>
