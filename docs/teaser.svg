<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 586" width="830" height="586" role="img" aria-labelledby="teaser-title teaser-desc">
  <title id="teaser-title">Graft running a session</title>
  <desc id="teaser-desc">A terminal where /graft:plan add rate limiting is typed. A plan card appears: Add rate limiting, written to .claude/graft/plans/add-rate-limiting.md with 3 milestones. /graft:orchestrate then runs two graft:worker cards side by side, Limiter middleware for milestone 1 and Config and env docs for milestone 2, which go from running to done. /graft:pr then opens a draft PR card, #18 Add rate limiting, from add-rate-limiting into main.</desc>
  <style>
    text { font-size: 14px; fill: #1f2328; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .muted { fill: #57606a; }
    .title { font-size: 15px; font-weight: 700; }
    .typed { font-size: 16px; }
    .mid { text-anchor: middle; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .card-pr { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .cmd { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .edge { fill: none; stroke: #6e7781; stroke-width: 2; }

    /* Base styles are the last frame; animations run once from the first frame and hold. */
    .typer { transform: translateX(278.4px); animation: type 2s steps(29, end) 0.6s both; }
    .caret-life { opacity: 0; animation: life 3s both; }
    .caret { animation: blink 1s steps(1) infinite; }
    .reveal { animation: reveal 0.4s ease-out both; }
    .step-plan { animation-delay: 3.2s; }
    .step-workers { animation-delay: 4.6s; }
    .step-pr { animation-delay: 7.4s; }
    .running { opacity: 0; animation: busy 2s steps(1, end) 4.6s both; }
    .done { animation: appear 0.3s ease-out 6.6s both; }

    @keyframes type { from { transform: translateX(0); } to { transform: translateX(278.4px); } }
    @keyframes life { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes busy { from { opacity: 1; } to { opacity: 0; } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <marker id="teaser-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <clipPath id="teaser-line">
      <rect x="58" y="62" width="740" height="40"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="828" height="584" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <g id="terminal">
    <rect class="card" x="21" y="21" width="788" height="90" rx="8"/>
    <rect x="21.5" y="21.5" width="787" height="32" rx="7.5" fill="#f6f8fa"/>
    <rect x="21.5" y="41" width="787" height="12.5" fill="#f6f8fa"/>
    <path d="M21.5 53.5 H808.5" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="41" cy="37.5" r="6" fill="#d0d7de"/>
    <circle cx="61" cy="37.5" r="6" fill="#d0d7de"/>
    <circle cx="81" cy="37.5" r="6" fill="#d0d7de"/>
    <text class="sans muted mid" x="415" y="42">notes-api</text>
    <text class="mono typed muted" x="41" y="88">&gt;</text>
    <g clip-path="url(#teaser-line)">
      <text class="mono typed" x="61" y="88" textLength="278.4" lengthAdjust="spacing">/graft:plan add rate limiting</text>
      <g class="typer">
        <rect x="61" y="64" width="760" height="36" fill="#ffffff"/>
        <g class="caret-life">
          <rect class="caret" x="61" y="73" width="9.6" height="20" fill="#0969da"/>
        </g>
      </g>
    </g>
  </g>

  <g class="reveal step-plan">
    <path class="edge" d="M415 112 V145" marker-end="url(#teaser-arrow)"/>
    <rect class="card" x="215" y="149" width="400" height="86" rx="8"/>
    <text class="sans muted" x="231" y="173">plan</text>
    <rect class="cmd" x="497" y="157" width="106" height="22" rx="11"/>
    <text class="sans mid" x="550" y="173">3 milestones</text>
    <text class="sans title" x="231" y="198">Add rate limiting</text>
    <text class="mono muted" x="231" y="221">.claude/graft/plans/add-rate-limiting.md</text>
  </g>

  <g class="reveal step-workers">
    <path class="edge" d="M415 236 V287 H213 V311" marker-end="url(#teaser-arrow)"/>
    <path class="edge" d="M415 287 H617 V311" marker-end="url(#teaser-arrow)"/>
    <rect class="cmd" x="323" y="246" width="184" height="26" rx="13"/>
    <text class="mono mid" x="415" y="264">/graft:orchestrate</text>

    <rect class="card" x="21" y="315" width="384" height="86" rx="8"/>
    <text class="mono muted" x="37" y="339">graft:worker</text>
    <text class="sans title" x="37" y="364">Limiter middleware</text>
    <text class="sans muted" x="37" y="387">implements milestone 1</text>

    <rect class="card" x="425" y="315" width="384" height="86" rx="8"/>
    <text class="mono muted" x="441" y="339">graft:worker</text>
    <text class="sans title" x="441" y="364">Config and env docs</text>
    <text class="sans muted" x="441" y="387">implements milestone 2</text>

    <g class="running">
      <rect class="cmd" x="317" y="323" width="76" height="22" rx="11"/>
      <text class="sans mid" x="355" y="339">running</text>
      <rect class="cmd" x="721" y="323" width="76" height="22" rx="11"/>
      <text class="sans mid" x="759" y="339">running</text>
    </g>
    <g class="done">
      <rect x="333" y="323" width="60" height="22" rx="11" fill="#dafbe1" stroke="#4ac26b" stroke-width="1"/>
      <text class="sans mid" x="363" y="339">done</text>
      <rect x="737" y="323" width="60" height="22" rx="11" fill="#dafbe1" stroke="#4ac26b" stroke-width="1"/>
      <text class="sans mid" x="767" y="339">done</text>
    </g>
  </g>

  <g class="reveal step-pr">
    <path class="edge" d="M213 402 V422 H617 V402"/>
    <path class="edge" d="M415 422 V473" marker-end="url(#teaser-arrow)"/>
    <rect class="cmd" x="365" y="432" width="100" height="26" rx="13"/>
    <text class="mono mid" x="415" y="450">/graft:pr</text>
    <rect class="card-pr" x="215" y="477" width="400" height="86" rx="8"/>
    <text class="sans muted" x="231" y="501">pull request</text>
    <rect x="543" y="485" width="60" height="22" rx="11" fill="#fff8c5" stroke="#d4a72c" stroke-width="1"/>
    <text class="sans mid" x="573" y="501">draft</text>
    <text class="sans title" x="231" y="526">#18 Add rate limiting</text>
    <text class="mono muted" x="231" y="549">add-rate-limiting → main</text>
  </g>
</svg>
